name: Test Xvfb contra Akamai (Hipercor/Mercadona)

# Experimento puntual: comprobar si un navegador "visible" dentro de una
# pantalla virtual (Xvfb) en un runner de GitHub Actions consigue lo mismo
# que en un PC de verdad (headless=False), o si Akamai sigue bloqueando por
# venir de una IP de datacenter en vez de una IP residencial.
#
# Se lanza a mano (workflow_dispatch) mientras es un experimento; si sale
# bien, esto es la base del futuro cron de "Próximos pasos" en el README.

on:
  workflow_dispatch:

jobs:
  test-xvfb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Instalar Chromium (Playwright) + dependencias del sistema
        run: playwright install --with-deps chromium

      - name: Instalar Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Test Hipercor (CP 33012)
        continue-on-error: true
        run: xvfb-run --auto-servernum python -m src.supermarkets.hipercor

      - name: Test Mercadona (CP 33012)
        continue-on-error: true
        run: xvfb-run --auto-servernum python -m src.supermarkets.mercadona
