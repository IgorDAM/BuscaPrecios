name: Generar precios (cron)

# Publica webapp/static/precios_generados.json con los precios de la
# lista habitual (data/lista_compra_habitual.json), para que la versión
# desplegada sin backend propio (Azure Static Web Apps) tenga datos que
# enseñar sin depender de que ningún PC de casa esté encendido. La
# versión en modo LAN/local sigue buscando en directo vía webapp/app.py
# y no usa este archivo para nada.
#
# scripts/generar_precios.py ya reintenta Hipercor y Mercadona varias
# veces si Akamai da problemas justo en esa ejecución: verificado en vivo
# (ver README, sección de la prueba de Xvfb) que el bloqueo es
# intermitente por IP del runner, no sistemático.
#
# Requiere que el repo tenga activado "Read and write permissions" para
# GITHUB_TOKEN (Settings -> Actions -> General -> Workflow permissions),
# si no el paso de commit/push fallará por falta de permisos.

on:
  schedule:
    # Cada 6 horas (00/06/12/18 UTC = ~02/08/14/20 en Madrid en verano).
    # Con la lista ampliada (80 productos), esto hace que un producto
    # nuevo que añadas tarde como mucho ~6h en aparecer sin tener que
    # lanzar el workflow a mano.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-precios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Instalar Chromium (Playwright) + dependencias del sistema
        run: playwright install --with-deps chromium

      - name: Instalar Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Generar precios_generados.json
        run: xvfb-run --auto-servernum python scripts/generar_precios.py

      - name: Comitear y subir el JSON si ha cambiado
        id: comitear
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/static/precios_generados.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los precios, no hace falta commit."
            echo "cambios=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Actualiza precios_generados.json ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
            echo "cambios=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Desplegar en Azure Static Web Apps
        # IMPORTANTE: el commit anterior lo hace github-actions[bot] usando
        # el GITHUB_TOKEN por defecto. GitHub NO dispara otros workflows
        # (como "Azure Static Web Apps CI/CD", que solo escucha "on: push")
        # para pushes hechos con ese token — es una protección anti-bucles.
        # Verificado en vivo (2026-09-02): tras el push de este job nunca
        # aparecía un nuevo run de "Azure Static Web Apps CI/CD", así que
        # la web publicada se quedaba con los precios viejos aunque el
        # repo ya tuviera el JSON actualizado. Por eso desplegamos aquí
        # mismo en vez de depender de ese disparo automático.
        if: steps.comitear.outputs.cambios == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_PEBBLE_07F8F3C10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/webapp/static"
          api_location: ""
          output_location: ""
