name: Rastrear catálogos (semanal)

# Rastrea el catálogo COMPLETO de Alimerka, Mercadona e Hipercor para el CP
# 33012 y publica webapp/static/catalogo_<super>.json. La web desplegada en
# Azure Static Web Apps busca sobre esos archivos (cualquier producto, no
# solo los de la lista habitual), porque desde la nube no se puede consultar
# Hipercor ni Mercadona en directo.
#
# Es uso personal: dos rastreos por semana (lunes y viernes de madrugada),
# con pausa entre peticiones. Coste: 0 €. El repo es público, así que los
# minutos de GitHub Actions son gratuitos; Azure Static Web Apps (plan Free)
# solo sirve los archivos.
#
# Cada supermercado se rastrea en un job aparte (IP de runner distinta, y si
# uno falla los otros se publican igualmente). Si un rastreo sale vacío o muy
# recortado, scripts/rastrear_catalogo.py NO sobrescribe el catálogo anterior.
#
# Requiere "Read and write permissions" para GITHUB_TOKEN
# (Settings -> Actions -> General -> Workflow permissions).

on:
  schedule:
    # Lunes y viernes a las 03:00 UTC (05:00 en Madrid en verano).
    - cron: "0 3 * * 1,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        super: [alimerka, mercadona, hipercor]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Instalar Chromium (Playwright) + Xvfb
        # Alimerka usa solo requests; Mercadona e Hipercor necesitan un
        # navegador visible (Akamai), que aquí corre bajo Xvfb.
        if: matrix.super != 'alimerka'
        run: |
          playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Rastrear ${{ matrix.super }}
        run: xvfb-run --auto-servernum python scripts/rastrear_catalogo.py --solo ${{ matrix.super }}

      - name: Guardar el catálogo
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: catalogo-${{ matrix.super }}
          path: webapp/static/catalogo_${{ matrix.super }}.json
          retention-days: 3

  publicar:
    needs: rastrear
    # También si algún supermercado ha fallado: se publican los que sí salieron.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar los catálogos que han salido bien
        uses: actions/download-artifact@v4
        with:
          pattern: catalogo-*
          path: webapp/static
          merge-multiple: true

      - name: Comitear y subir si hay cambios
        id: comitear
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/static/catalogo_*.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los catálogos, no hace falta commit."
            echo "cambios=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Actualiza catálogos de supermercados ($(date -u +%Y-%m-%dT%H:%MZ))"
            # Si se ha subido algo mientras rastreaba (tarda un buen rato), el
            # push se rechaza: se integra lo nuevo y se reintenta.
            for intento in 1 2 3; do
              git pull --rebase origin master && git push && break
              echo "Push rechazado (intento $intento), reintentando..."
              sleep 5
            done
            git push --dry-run >/dev/null 2>&1 || { echo "No se pudo subir"; exit 1; }
            echo "cambios=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar API de Alimerka (copia los conectores a api/_lib)
        if: steps.comitear.outputs.cambios == 'true'
        run: |
          mkdir -p api/_lib/supermarkets
          cp src/supermarkets/base.py src/supermarkets/medidas.py src/supermarkets/alimerka.py api/_lib/supermarkets/
          printf 'from .alimerka import Alimerka\n' > api/_lib/supermarkets/__init__.py

      - name: Desplegar en Azure Static Web Apps
        # Se despliega aquí mismo porque GitHub no dispara otros workflows
        # (el "Azure Static Web Apps CI/CD") por pushes hechos con el
        # GITHUB_TOKEN: ver el comentario equivalente en precios-cron.yml.
        if: steps.comitear.outputs.cambios == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_PEBBLE_07F8F3C10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/webapp/static"
          api_location: "api"
          output_location: ""

      - name: Avisar si algún rastreo ha fallado
        # Deja el workflow en rojo (y Actions te avisa) aunque se haya
        # publicado lo que sí salió bien.
        if: ${{ needs.rastrear.result != 'success' }}
        run: |
          echo "Algún supermercado no se ha rastreado bien: mira el job 'rastrear'."
          exit 1
